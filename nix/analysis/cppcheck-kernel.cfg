<?xml version="1.0"?>
<!--
  SPDX-License-Identifier: GPL-2.0-only

  nix/analysis/cppcheck-kernel.cfg

  cppcheck runs without the kernel headers, so it stops at the first
  iterator macro it cannot expand (unknownMacro) and skips the rest of
  that file. These match include/linux/list.h closely enough to parse,
  and KERNEL_VERSION() include/generated/uapi/linux/version.h, so a
  version check does not stop the file at its #if.
-->
<def format="2">
  <define name="KERNEL_VERSION(a, b, c)"
          value="(((a) &lt;&lt; 16) + ((b) &lt;&lt; 8) + ((c) &gt; 255 ? 255 : (c)))"/>
  <define name="list_entry(ptr, type, member)"
          value="((type *)((char *)(ptr) - offsetof(type, member)))"/>
  <define name="list_for_each_entry(pos, head, member)"
          value="for (pos = list_entry((head)-&gt;next, __typeof__(*pos), member); &amp;pos-&gt;member != (head); pos = list_entry(pos-&gt;member.next, __typeof__(*pos), member))"/>
  <define name="list_for_each_entry_safe(pos, n, head, member)"
          value="for (pos = list_entry((head)-&gt;next, __typeof__(*pos), member), n = list_entry(pos-&gt;member.next, __typeof__(*pos), member); &amp;pos-&gt;member != (head); pos = n, n = list_entry(n-&gt;member.next, __typeof__(*n), member))"/>
</def>
